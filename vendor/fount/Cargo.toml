[package]
name = "fount"
description = "A font manager for iced applications"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/airstrike/fount"

[features]
default = ["google"]
google = ["dep:reqwest", "dep:serde_json"]
office = []

[dependencies]
iced_core = "0.15.0-dev"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
tokio = { version = "1", features = ["fs"] }
toml = "0.8"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3.27.0"
