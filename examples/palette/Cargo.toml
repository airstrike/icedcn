[package]
name = "palette"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
icedcn = { workspace = true, features = ["chart", "spinner", "svg"] }
iced = { workspace = true, features = ["default", "svg"] }
iced_widget = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true, features = ["tokio"] }

[build-dependencies]
iced_lucide = { git = "https://github.com/airstrike/iced_lucide", branch = "codex/configurable-source" }
