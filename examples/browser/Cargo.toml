[package]
name = "browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
palette = { path = "../palette" }
browser-routing = { path = "routing" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"
icedcn = { workspace = true, features = ["chart", "fount", "markdown", "spinner", "svg", "sweeten"] }
iced = { workspace = true, features = ["advanced", "advanced-shaping", "markdown", "highlighter", "selector", "svg", "image"] }
iced_widget.workspace = true
sweeten.workspace = true
# The playground example runs user Rust in an embedded rawr engine. Named
# apart from `rawr` so it doesn't meet rawr's own runtime under `rawr run`.
rawr-engine = { package = "rawr", git = "https://github.com/airstrike/rawr" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true, features = ["tokio"] }
open = "5"
tokio = { version = "1", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The playground's rawr engine seeds its hash maps from getrandom, which
# takes the page's crypto in a browser.
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
tree-sitter.workspace = true
wasmtimer = "0.4"
web-sys = { version = "0.3", features = ["Window", "Navigator", "console"] }

[build-dependencies]
iced_lucide = { git = "https://github.com/airstrike/iced_lucide", branch = "codex/configurable-source" }

[dev-dependencies]
iced_test.workspace = true
