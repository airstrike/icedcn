[package]
name = "browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
browser-routing = { path = "routing" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"
icedcn = { workspace = true, features = ["chart", "markdown", "spinner", "svg", "sweeten"] }
iced = { workspace = true, features = ["advanced", "advanced-shaping", "markdown", "highlighter", "selector", "svg", "image"] }
iced_widget.workspace = true
sweeten.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true, features = ["tokio"] }
open = "5"
fount = { git = "https://github.com/airstrike/fount" }
tokio = { version = "1", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tree-sitter.workspace = true
wasmtimer = "0.4"
web-sys = { version = "0.3", features = ["Window", "Navigator", "console"] }

[build-dependencies]
iced_lucide = { git = "https://github.com/airstrike/iced_lucide", branch = "codex/configurable-source" }

[dev-dependencies]
iced_test.workspace = true
