[package]
name = "browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"
icedxdy = { workspace = true, features = ["markdown", "spinner", "svg", "sweeten"] }
iced = { workspace = true, features = ["advanced-shaping", "markdown", "highlighter", "selector", "tokio", "svg", "image"] }
iced_widget.workspace = true
sweeten.workspace = true
fount = { git = "https://github.com/airstrike/fount" }
tokio = { version = "1", features = ["fs"] }

[build-dependencies]
iced_lucide = { git = "https://github.com/airstrike/iced_lucide", branch = "codex/configurable-source" }

[dev-dependencies]
iced_test.workspace = true
