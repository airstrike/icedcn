<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="license" href="/font-licenses.txt">
  BROWSER_METADATA
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #splash {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 20px; color: #fafafa; font-family: system-ui, sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 42px; font-weight: 600; letter-spacing: -.055em; }
    h1 svg { display: block; width: 56px; height: 56px; }
    #progress { width: 180px; height: 3px; border-radius: 2px; overflow: hidden; background: #444; }
    #progress span { display: block; width: 100%; height: 100%; background: currentColor; transform-origin: left; }
    #progress:not([aria-valuenow]) span { width: 30%; animation: sweep 1.1s ease-in-out infinite alternate; }
    @keyframes sweep { to { transform: translateX(233%); } }
    @media (prefers-reduced-motion: reduce) { #progress:not([aria-valuenow]) span { animation: none; } }
    #splash p { margin: 0; padding: 0 24px; text-align: center; }
    /* The transparent canvas covers the splash as soon as iced paints its background. */
    canvas { position: relative; outline: none; }
    .documentation { padding: 24px; background: #fafafa; color: #18181b; }
    .documentation pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.6 system-ui, sans-serif; }
    #splash:has([role="alert"]) { z-index: 1; background: #0a0a0a; }
  </style>
</head>
<body>
  <main id="splash">
    <h1><span aria-hidden="true">BROWSER_LOGO</span>icedcn</h1>
    <div id="progress" role="progressbar" aria-label="Loading components"><span></span></div>
    <noscript><style>html, body { height: auto; overflow: auto; } #splash { position: static; padding: 32px; } #progress { display: none; }</style><p>This component browser requires JavaScript and WebAssembly.</p></noscript>
  </main>
  BROWSER_DOCUMENTATION
  <script type="module">
    // Keep native browser reload (including Shift-reload) away from winit's
    // canvas key handler, which prevents the default for every keydown.
    window.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "r") {
        event.stopPropagation();
      }
    }, { capture: true });

    // The canvas renders icedcn's own context menus; surrounding HTML keeps
    // the browser's normal context menu.
    window.addEventListener("contextmenu", event => {
      if (event.target instanceof HTMLCanvasElement) event.preventDefault();
    });

    const splash = document.querySelector("#splash");
    const bar = document.querySelector("#progress");
    const query = new URLSearchParams(location.search);

    // Every startup step has a deadline, so a hung step ends in a message or
    // in the CPU renderer instead of an endless splash.
    const STALLED_DOWNLOAD = 30_000;
    const SLOW_START = 120_000;
    const GPU_REQUEST = 5_000;
    const FIRST_VIEW = 20_000;

    function fail(text, error) {
      if (error) console.error(error);
      let message = splash.querySelector('[role="alert"]');
      if (!message) {
        message = document.createElement("p");
        message.setAttribute("role", "alert");
        splash.append(message);
      }
      message.textContent = text;
      bar.hidden = true;
      splash.removeAttribute("aria-hidden");
    }

    const RELOAD = "The component browser could not start. Reload the page to try again.";

    function deadline(promise, ms, error) {
      let timer;
      const expired = new Promise((_, reject) => { timer = setTimeout(() => reject(error), ms); });
      return Promise.race([promise, expired]).finally(() => clearTimeout(timer));
    }

    // A WebGPU request that never settles (some mobile drivers) would stall
    // wgpu's own probe forever. Past the deadline the adapter request reports
    // no adapter and the device request fails, so wgpu moves on to WebGL2.
    if (typeof GPU !== "undefined" && typeof GPUAdapter !== "undefined") {
      const requestAdapter = GPU.prototype.requestAdapter;
      GPU.prototype.requestAdapter = function (...options) {
        const request = requestAdapter.apply(this, options);
        return deadline(request, GPU_REQUEST, new Error("WebGPU adapter request timed out"))
          .catch(error => { console.warn(error); return null; });
      };
      const requestDevice = GPUAdapter.prototype.requestDevice;
      GPUAdapter.prototype.requestDevice = function (...options) {
        const request = requestDevice.apply(this, options);
        return deadline(request, GPU_REQUEST, new Error("WebGPU device request timed out"));
      };
    }

    // Restarts on the CPU renderer when the GPU renderer failed or hung. The
    // wasm is cached as immutable, so the restart skips the download.
    function fallback(reason) {
      if (globalThis.icedcnRenderer === "cpu") return false;
      console.warn(`${reason}; restarting with the CPU renderer`);
      query.set("renderer", "cpu");
      location.replace(`${location.pathname}?${query}${location.hash}`);
      return true;
    }

    let ready = false;
    globalThis.icedcnReady = () => {
      ready = true;
      // A slow start may already have shown a message; the app covers it.
      splash.querySelector('[role="alert"]')?.remove();
      splash.setAttribute("aria-hidden", "true");
    };
    globalThis.icedcnFailed = error => {
      if (!ready && fallback("The app panicked during startup")) return;
      fail(ready ? "The component browser stopped working. Reload the page to try again." : RELOAD, error);
    };

    async function download() {
      const controller = new AbortController();
      let stall = setTimeout(() => controller.abort(), STALLED_DOWNLOAD);
      const stalled = () => controller.signal.aborted ? new Error("Wasm download stalled") : null;
      let response;
      try {
        response = await fetch("/BROWSER_WASM", { signal: controller.signal });
      } catch (error) {
        clearTimeout(stall);
        throw stalled() ?? error;
      }
      if (!response.ok) throw new Error(`Wasm download failed (HTTP ${response.status})`);
      if (!response.body || typeof TransformStream === "undefined") {
        clearTimeout(stall);
        return response;
      }

      // Fetch delivers decoded bytes, even when the server compresses the response.
      const total = BROWSER_BYTES;
      let received = 0;
      const stream = response.body.pipeThrough(new TransformStream({
        transform(chunk, output) {
          clearTimeout(stall);
          stall = setTimeout(() => output.error(new Error("Wasm download stalled")), STALLED_DOWNLOAD);
          received += chunk.byteLength;
          const fraction = Math.min(received / total, 1);
          bar.firstElementChild.style.transform = `scaleX(${fraction})`;
          bar.setAttribute("aria-valuenow", Math.floor(fraction * 100));
          output.enqueue(chunk);
        },
        flush() {
          clearTimeout(stall);
        },
      }));
      return new Response(stream, { headers: { "Content-Type": "application/wasm" } });
    }

    // Mirrors the checks wgpu makes: a WebGPU adapter, then a WebGL2 context.
    // With neither, iced draws with tiny-skia and the app shows a notice.
    // `?renderer=webgl` or `?renderer=cpu` forces a tier.
    async function renderer() {
      const forced = query.get("renderer");
      if (forced === "cpu") return "cpu";
      try {
        if (forced !== "webgl" && navigator.gpu && await navigator.gpu.requestAdapter()) return "webgpu";
      } catch {}
      // Hidden from wgpu too, so it goes straight to WebGL2 instead of
      // waiting on a WebGPU adapter that is forced off, missing or hung.
      if (navigator.gpu) Object.defineProperty(navigator, "gpu", { value: undefined });
      const gl = document.createElement("canvas").getContext("webgl2", { antialias: false });
      gl?.getExtension("WEBGL_lose_context")?.loseContext();
      return gl ? "webgl" : "cpu";
    }

    try {
      const [{ default: start }, module_or_path, tier] = await Promise.all([
        import("/BROWSER_MODULE"), download(), renderer(),
      ]);
      globalThis.icedcnRenderer = tier;
      // Compiles the wasm and starts iced, which then sets up its renderer
      // and asks for the first view in the background.
      await deadline(start({ module_or_path }), SLOW_START, new Error("Startup timed out"));
      setTimeout(() => {
        if (ready || splash.querySelector('[role="alert"]')) return;
        if (!fallback("The renderer did not start")) fail(RELOAD);
      }, FIRST_VIEW);
    } catch (error) {
      fail(RELOAD, error);
    }
  </script>
</body>
</html>
