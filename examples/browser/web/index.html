  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #splash {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 20px; color: #fafafa; font-family: system-ui, sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 42px; font-weight: 600; letter-spacing: -.055em; }
    h1 svg { display: block; width: 56px; height: 56px; }
    #progress { width: 180px; height: 3px; border-radius: 2px; overflow: hidden; background: #444; }
    #progress span { display: block; width: 100%; height: 100%; background: currentColor; transform-origin: left; }
    #progress:not([aria-valuenow]) span { width: 30%; animation: sweep 1.1s ease-in-out infinite alternate; }
    @keyframes sweep { to { transform: translateX(233%); } }
    @media (prefers-reduced-motion: reduce) { #progress:not([aria-valuenow]) span { animation: none; } }
    #splash p { margin: 0; padding: 0 24px; text-align: center; }
    /* The transparent canvas covers the splash as soon as iced paints its background. */
    canvas { position: relative; outline: none; }
    #splash:has([role="alert"]) { z-index: 1; background: #0a0a0a; }
  </style>
</head>
<body>
  <main id="splash">
    <h1><span aria-hidden="true">BROWSER_LOGO</span>icedcn</h1>
    <div id="progress" role="progressbar" aria-label="Loading components"><span></span></div>
    <noscript><style>#progress { display: none; }</style><p>This component browser requires JavaScript and WebAssembly.</p></noscript>
  </main>
  <script type="module">
    // Keep native browser reload (including Shift-reload) away from winit's
    // canvas key handler, which prevents the default for every keydown.
    window.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "r") {
        event.stopPropagation();
      }
    }, { capture: true });

    // The canvas renders icedcn's own context menus; surrounding HTML keeps
    // the browser's normal context menu.
    window.addEventListener("contextmenu", event => {
      if (event.target instanceof HTMLCanvasElement) event.preventDefault();
    });

    const splash = document.querySelector("#splash");
    const bar = document.querySelector("#progress");

    async function download() {
      const response = await fetch("/BROWSER_WASM");
      if (!response.ok) throw new Error(`Wasm download failed (HTTP ${response.status})`);
      if (!response.body || typeof TransformStream === "undefined") return response;

      // Fetch delivers decoded bytes, even when the server compresses the response.
      const total = BROWSER_BYTES;
      let received = 0;
      const stream = response.body.pipeThrough(new TransformStream({
        transform(chunk, controller) {
          received += chunk.byteLength;
          const fraction = Math.min(received / total, 1);
          bar.firstElementChild.style.transform = `scaleX(${fraction})`;
          bar.setAttribute("aria-valuenow", Math.floor(fraction * 100));
          controller.enqueue(chunk);
        },
      }));
      return new Response(stream, { headers: { "Content-Type": "application/wasm" } });
    }

    try {
      const [{ default: start }, module_or_path] = await Promise.all([
        import("/BROWSER_MODULE"), download(),
      ]);
      await start({ module_or_path });
      splash.setAttribute("aria-hidden", "true");
    } catch (error) {
      const message = document.createElement("p");
      message.setAttribute("role", "alert");
      message.textContent = "The component browser could not start. Reload the page to try again.";
      bar.replaceWith(message);
      console.error(error);
    }
  </script>
</body>
