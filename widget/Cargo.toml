[package]
name = "icedcn_widget"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wgpu", "vello-cpu", "symbols"]
# Pick the concrete `iced_widget::Renderer` the widgets draw with, as iced's
# features of the same names do. With both on, wgpu is tried first and
# vello_cpu is the fallback. With neither, iced_widget's renderer is `()`.
# `wgpu` carries wgpu's default backends, like iced's: without them the wgpu
# compositor panics instead of falling back.
wgpu = ["iced_widget/wgpu", "iced_renderer/wgpu"]
vello-cpu = ["iced_renderer/vello-cpu"]
chart = ["dep:hyozu", "icedcn_core/chart"]
canvas = ["iced_widget/canvas"]
crisp = []
highlighter = [
    "dep:iced_highlighter",
    "dep:log",
    "dep:serde",
    "dep:serde_json",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
]
markdown = ["dep:pulldown-cmark", "highlighter"]
spinner = ["canvas", "dep:lyon_algorithms"]
svg = ["iced_widget/svg", "icedcn_core/svg"]
sweeten = ["dep:sweeten", "icedcn_core/sweeten"]
# Bundle Inter Symbols (SIL OFL 1.1, `fonts/InterSymbols-OFL.txt`) as a fallback
# for the key and interface symbols the widgets draw.
symbols = []

[dependencies]
hyozu = { workspace = true, optional = true }
icedcn_core.workspace = true
iced_core.workspace = true
iced_graphics.workspace = true
# Only here so the renderer features can reach `iced_renderer`'s.
iced_renderer.workspace = true
iced_highlighter = { workspace = true, optional = true }
iced_runtime = { workspace = true, features = ["selector"] }
iced_widget = { workspace = true, features = ["image", "svg"] }
log = { workspace = true, optional = true }
lyon_algorithms = { version = "1.0", optional = true }
num-traits = "0.2"
pulldown-cmark = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sweeten = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
unicode-normalization = "0.1"
unicode-segmentation = "1.11.0"
jalali-rs = "0.1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

[dev-dependencies]
iced_test.workspace = true
