[package]
name = "icedcn"
description = "Themed widgets for iced applications"
exclude = ["/scripts/sync-nova.sh"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["wgpu", "vello-cpu", "symbols"]
# Renderers, mirroring iced's features of the same names: wgpu first, vello_cpu
# as the fallback. Turn off default features and pick one to compile only that
# renderer.
wgpu = ["icedcn_widget/wgpu"]
vello-cpu = ["icedcn_widget/vello-cpu"]
fount = ["dep:fount", "dep:iced_runtime"]
chart = ["icedcn_core/chart", "icedcn_widget/chart"]
highlighter = ["icedcn_widget/highlighter"]
markdown = ["icedcn_core/markdown", "icedcn_widget/markdown"]
spinner = ["icedcn_widget/spinner"]
svg = ["icedcn_core/svg", "icedcn_widget/svg"]
sweeten = ["icedcn_widget/sweeten"]
symbols = ["icedcn_widget/symbols"]

[dependencies]
fount = { git = "https://github.com/airstrike/fount", rev = "319c642bdca4181bea76b11933697326b1a424f2", optional = true }
icedcn_core.workspace = true
icedcn_widget.workspace = true
iced_core.workspace = true
iced_runtime = { workspace = true, optional = true }
iced_widget.workspace = true

[workspace]
members = [
    "cli",
  "core",
  "widget",
  "examples/browser",
  "examples/browser/routing",
  "examples/highlight",
  "examples/palette",
]

[workspace.package]
version = "0.1.0"
authors = ["Andy Terra <tech@andyterra.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/airstrike/icedcn"
categories = ["gui"]
keywords = ["gui", "iced", "graphics", "interface", "widgets"]
rust-version = "1.85"

[workspace.dependencies]
icedcn = { path = "." }
icedcn_core = { path = "./core" }
icedcn_widget = { path = "./widget", default-features = false }
hyozu = { git = "https://github.com/airstrike/hyozu", rev = "2892f6c6a99639ad5d4c96cf926ed9fe3c616d86" }

# Dependents pick the renderer. Examples opt into iced's defaults themselves.
iced = { version = "0.15.0-dev", default-features = false }
iced_core = "0.15.0-dev"
iced_graphics = "0.15.0-dev"
iced_renderer = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_highlighter = "0.15.0-dev"
iced_selector = "0.15.0-dev"
iced_test = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_widget = { version = "0.15.0-dev", features = ["qr_code"] }
# Sweeten ships an enhanced data-grid `Table` (border, sticky header,
# header underline) on its `dev` branch. Once `dev` merges to `master`
# upstream, drop the `branch` qualifier.
sweeten = { git = "https://github.com/airstrike/sweeten.git", branch = "dev" }
log = "0.4"
pulldown-cmark = { version = "0.12", default-features = false, features = [
  "html",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"

# Keep debug info in one file per crate instead of an object per codegen unit
# per rebuild, which macOS's default (unpacked) leaves piling up in target/.
[profile.dev]
split-debuginfo = "packed"

# Optimize dependencies (built once, cached) while the workspace crates stay at
# the default dev opt-level for fast incremental recompiles. The per-frame
# widget walk lives mostly in deps (iced/wgpu/icedcn_widget), so this is the
# big lever for dev-loop runtime cost without slowing incremental compiles.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
iced = { git = "https://github.com/airstrike/iced.git", branch = "dev", features = ["qr_code"] }
iced_core = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_runtime = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_selector = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_test = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_widget = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_graphics = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_renderer = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_program = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_winit = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_wgpu = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_vello_cpu = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_futures = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_debug = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_highlighter = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }

# cryoglyph pins hecrj/cosmic-text; route it to the same fork iced uses.
[patch."https://github.com/hecrj/cosmic-text.git"]
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
